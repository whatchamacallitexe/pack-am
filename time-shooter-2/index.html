<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Time Shooter 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script src="https://glaxyias.github.io/JS/cdn-resilient.js"></script>
<link href="https://cdn.jsdelivr.net/gh/mistirk/googleapis@499ff451605f5a085318b5d6252b4e1d93f456d1/grafeas/v1/style.css" rel="stylesheet">
</head>
<body class="dark">
<div class="unity-desktop" id="unity-container">
<canvas id="unity-canvas" style="background: url('https://cdn.jsdelivr.net/gh/mistirk/googleapis@499ff451605f5a085318b5d6252b4e1d93f456d1/grafeas/v1/ts2.jpg') center center / cover;"></canvas>
</div>
<div id="loading-cover">
<div id="unity-loading-bar">
<div id="unity-logo"><img src="https://cdn.jsdelivr.net/gh/mistirk/googleapis@499ff451605f5a085318b5d6252b4e1d93f456d1/grafeas/v1/logo.png"></div>
<div id="unity-progress-bar-empty"><div id="unity-progress-bar-full" style="width: 0%;"></div></div>
</div>
</div>
<script>
const buildUrl = "https://cdn.jsdelivr.net/gh/mistirk/googleapis@499ff451605f5a085318b5d6252b4e1d93f456d1/grafeas/v1";
const loaderUrl = buildUrl + "/ts2.loader.js";
const config = {
  dataUrl: buildUrl + "/ts2.data",
  frameworkUrl: buildUrl + "/ts2.framework.js",
  codeUrl: buildUrl + "/ts2.wasm",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "GoGoMan",
  productName: "Time Shooter 2",
  productVersion: "0.1",
};
const container = document.querySelector("#unity-container");
const canvas = document.querySelector("#unity-canvas");
const loadingCover = document.querySelector("#loading-cover");
const progressBarFull = document.querySelector("#unity-progress-bar-full");
if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
  container.className = "unity-mobile";
  config.devicePixelRatio = 1;
}
const script = document.createElement("script");
script.src = loaderUrl;
script.onload = () => {
  createUnityInstance(canvas, config, (progress) => {
    progressBarFull.style.width = (100 * progress) + "%";
  }).then((unityInstance) => {
    loadingCover.style.display = "none";
  }).catch((message) => {
    alert(message);
  });
};
document.body.appendChild(script);
</script>
</body>
</html>
